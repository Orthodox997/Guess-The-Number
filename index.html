<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Number Guessing Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f6fc;
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      background: #fff;
      padding: 2rem 2.5rem;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(60,80,130,0.12);
      width: 360px;
      max-width: 95vw;
    }
    h1 {
      color: #1743b6;
      margin-top: 0;
      text-align: center;
    }
    .label {
      margin-top: 1rem;
    }
    input[type="number"], select {
      width: 120px;
      font-size: 1rem;
      padding: .3rem;
      border: 1px solid #b7c6e3;
      border-radius: 5px;
    }
    button {
      margin-top: 1em;
      font-size: 1rem;
      padding: .6em 1.2em;
      background: #2466f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #1841a3; }
    #message {
      margin: 1em 0;
      min-height: 36px;
      text-align: center;
      font-size: 1.16em;
    }
    #highscore {
      font-size: .95em;
      color: #5b6776;
      margin-bottom: .5em;
      text-align: center;
    }
    .quit-btn {
      margin-top: .3em;
      background: #fd5656;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <h1>🔢 Guess the Number</h1>
    <div id="highscore"></div>
    <div id="setup">
      <div>
        <label for="difficulty"><b>Difficulty:</b></label>
        <select id="difficulty">
          <option value="easy">Easy (15 attempts)</option>
          <option value="medium" selected>Medium (10 attempts)</option>
          <option value="hard">Hard (5 attempts)</option>
        </select>
      </div>
      <button onclick="startGame()">Start Game</button>
    </div>
    <div id="gameplay" style="display:none;">
      <div class="label"><b>I'm thinking of a number between 1 and 100.</b></div>
      <div class="label" id="attempts-remaining"></div>
      <input type="number" id="guess-input" min="1" max="100" placeholder="Enter your guess..." />
      <button onclick="submitGuess()">Guess</button>
      <button class="quit-btn" onclick="quitGame()">Quit</button>
      <div id="message"></div>
    </div>
    <div id="result" style="display:none;">
      <div id="result-message"></div>
      <button onclick="startGame()">Play Again</button>
      <button class="quit-btn" onclick="resetAll()">Quit</button>
    </div>
  </div>
  <script>
    // Game settings
    const attemptsByDifficulty = { easy: 15, medium: 10, hard: 5 };

    // State
    let numberToGuess = 0;
    let attempts = 0;
    let maxAttempts = 0;

    let highscore = localStorage.getItem('ng_highscore');
    if (highscore) {
      document.getElementById('highscore').textContent = "🥇 High Score: " + highscore + " attempts";
    } else {
      document.getElementById('highscore').textContent = "No high score yet. Be the first!";
    }

    function startGame() {
      // Reset state
      document.getElementById('result').style.display = 'none';
      document.getElementById('setup').style.display = 'none';
      document.getElementById('gameplay').style.display = 'block';

      const difficulty = document.getElementById('difficulty').value;
      maxAttempts = attemptsByDifficulty[difficulty];
      attempts = 0;
      numberToGuess = Math.floor(Math.random() * 100) + 1;
      document.getElementById('message').textContent = "";
      document.getElementById('guess-input').value = "";
      document.getElementById('attempts-remaining').textContent =
        `Attempts: 0 / ${maxAttempts}`;
      document.getElementById('guess-input').focus();
    }

    function submitGuess() {
      const input = document.getElementById('guess-input').value.trim();
      if (input === "") {
        showMessage("⚠️ Please enter a number.");
        return;
      }
      const guess = Number(input);
      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        showMessage("⚠️ Enter a valid integer between 1 and 100.");
        return;
      }

      attempts++;
      document.getElementById('attempts-remaining').textContent =
        `Attempts: ${attempts} / ${maxAttempts}`;

      if (guess === numberToGuess) {
        // Handle win & high score
        let msg = `🎉 Correct! The number was ${numberToGuess}.<br>You solved it in <b>${attempts}</b> attempts!`;
        highscore = localStorage.getItem('ng_highscore');
        if (!highscore || attempts < +highscore) {
          msg += `<br>🥇 <b>New high score!</b>`;
          localStorage.setItem('ng_highscore', attempts);
          document.getElementById('highscore').textContent = "🥇 High Score: " + attempts + " attempts";
        } else if (highscore) {
          msg += `<br>🏅 High score: ${highscore} attempts.`;
        }
        showResult(msg);
      } else if (attempts === maxAttempts) {
        showResult(`😞 Game over! The correct number was <b>${numberToGuess}</b>.`);
      } else if (guess < numberToGuess) {
        showMessage("📉 Too low! Try a higher number.");
      } else {
        showMessage("📈 Too high! Try a lower number.");
      }
      document.getElementById('guess-input').value = "";
      document.getElementById('guess-input').focus();
    }

    function quitGame() {
      showResult(`👋 Game exited.<br>The number was <b>${numberToGuess}</b>.`);
    }

    function resetAll() {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('gameplay').style.display = 'none';
      document.getElementById('result').style.display = 'none';
      document.getElementById('highscore').textContent = localStorage.getItem('ng_highscore')
        ? "🥇 High Score: " + localStorage.getItem('ng_highscore') + " attempts"
        : "No high score yet. Be the first!";
    }

    function showResult(msg) {
      document.getElementById('gameplay').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('result-message').innerHTML = msg;
    }

    function showMessage(msg) {
      document.getElementById('message').innerHTML = msg;
    }

    // Enter key triggers submit
    document.getElementById('guess-input').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') submitGuess();
    });
  </script>
</body>
</html>
